version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # pip is omitted on purpose. The Python in this repo (certification/bounds.py
  # and its tests) is stdlib-only and there is no requirements.txt or
  # pyproject.toml. A pip entry makes the Dependabot updater fail with
  # "No files found in /" (see Dependabot run 42129339952 / #1684152451).
