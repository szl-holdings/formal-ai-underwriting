version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Hash-pinned build backend used by the CI "package" job
  # (requirements/ci/build.in -> build.txt, `uv pip compile --generate-hashes`).
  # The package itself has no runtime dependencies (pyproject.toml
  # `dependencies = []`), so the repository root is not watched. The earlier
  # root-level pip entry failed with "No files found in /" (Dependabot run
  # 42129312462) because the repository then had no pip manifest at all.
  - package-ecosystem: "pip"
    directory: "/requirements/ci"
    schedule:
      interval: "weekly"
