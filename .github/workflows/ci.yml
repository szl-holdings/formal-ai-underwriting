name: CI

# The repository's only executable surface is the stdlib-only
# certification/bounds.py module and its unittest regression suite.
#   test:    runs that suite on every CPython the package supports
#            (requires-python >= 3.11). Stdlib only: nothing is installed.
#   package: builds the wheel with a hash-pinned build backend, checks that it
#            ships the `certification` package, installs it and runs the
#            documented CLI from outside the checkout. (A wheel with no code in
#            it passed CI before this job existed.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: test (CPython ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile sources
        run: python -m py_compile certification/__init__.py certification/bounds.py tests/test_bounds.py

      - name: Run bound-semantics regression tests
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the hash-pinned build backend
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/ci/build.txt

      - name: Build the wheel (no build isolation; backend pinned above)
        run: python -m pip wheel --disable-pip-version-check --no-deps --no-build-isolation --wheel-dir dist .

      - name: Check the wheel ships the certification package
        run: python .github/scripts/check_wheel.py dist

      - name: Install the wheel and run the documented CLI outside the checkout
        run: |
          python -m pip install --disable-pip-version-check --no-deps ./dist/formal_ai_underwriting-*.whl
          cd "$RUNNER_TEMP"
          python -c 'import certification.bounds as b; print("imported from", b.__file__)'
          python -m certification.bounds 3 48 > cert.json
          python -c 'import json, sys; c = json.load(open("cert.json")); ok = c.get("schema") == "szl.underwriting.risk-bound/v1" and c.get("measured") == {"errors": 3, "n": 48, "empirical_risk": 0.0625}; print("installed CLI", "OK" if ok else "MISMATCH", c.get("hoeffding_bound")); sys.exit(0 if ok else 1)'
