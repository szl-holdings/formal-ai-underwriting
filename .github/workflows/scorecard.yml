name: Scorecard

# Org reusable OpenSSF Scorecard gate (SHA-pinned caller), as in the other
# szl-holdings repositories. Pinned to the same szl-holdings/.github commit as
# codeql.yml; reusable-scorecard.yml is unchanged there since 8dfc69d1.
# branch_protection_rule trigger intentionally omitted (see the reusable's note).
# No `secrets: inherit`: the reusable workflow declares no secrets and
# publishes with the job's OIDC token.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 3'  # weekly, Wednesday 07:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scorecard:
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
    uses: szl-holdings/.github/.github/workflows/reusable-scorecard.yml@c67bdb2b8ab26d08e755b4f5b6f0f9c5cfd3f309
